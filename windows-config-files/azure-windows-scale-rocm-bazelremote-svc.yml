apiVersion: v1
kind: Service
metadata:
    name: bazelremote-svc
    namespace: bazelremote-ns
spec:
    clusterIP: 10.0.3.202
    clusterIPs:
    - 10.0.3.202
    internalTrafficPolicy: Cluster
    selector:
      app: bazelremote
    ports:
    - protocol: TCP
      port: 9092
      targetPort: 9092
      name: grpc
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http-default
    type: ClusterIP # For internal cluster access